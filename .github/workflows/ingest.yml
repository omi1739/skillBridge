name: Scheduled Job Ingestion

# Refresh SkillBridge's labor-market dataset from the live public job API on a
# schedule. Uses the ADMIN ingestion endpoint so data keeps flowing without
# manual intervention. Requires these repository secrets:
#   INGEST_API_BASE  e.g. https://skillbridge-cv3e.onrender.com/api
#   INGEST_EMAIL     owner/ADMIN email
#   INGEST_PASSWORD  owner/ADMIN password
on:
  schedule:
    - cron: '23 3 * * *'   # UTC daily
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trigger live job ingestion
        env:
          API_BASE: ${{ secrets.INGEST_API_BASE }}
          EMAIL: ${{ secrets.INGEST_EMAIL }}
          PASSWORD: ${{ secrets.INGEST_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$API_BASE" ] || [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Missing required secrets. Ensure INGEST_API_BASE, INGEST_EMAIL, and INGEST_PASSWORD are set in repository settings."
            exit 1
          fi

          echo "Logging in as $EMAIL ..."
          HTTP_CODE=$(curl -s -o LOGIN_BODY -w '%{http_code}' --max-time 30 -X POST "$API_BASE/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Login failed (HTTP $HTTP_CODE). Response: $(cat LOGIN_BODY)"
            exit 1
          fi

          TOKEN=$(printf '%s' "$LOGIN_BODY" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try {
                const r = JSON.parse(s);
                if (r && typeof r.token === "string" && r.token.length > 0) {
                  console.log(r.token);
                } else {
                  console.error("Login response missing token field:", s);
                  process.exit(1);
                }
              } catch(e) {
                console.error("Failed to parse login response:", e.message, s);
                process.exit(1);
              }
            })')
          echo "Login successful."

          echo "Triggering job ingestion ..."
          REPORT=$(curl -s -o INGEST_BODY -w '%{http_code}' --max-time 120 -X POST "$API_BASE/ingest/run" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}')
          if [ "$REPORT" -lt 200 ] || [ "$REPORT" -ge 300 ]; then
            echo "::error::Ingestion request failed (HTTP $REPORT). Response: $(cat INGEST_BODY)"
            exit 1
          fi

          cat INGEST_BODY
          printf '%s' "$INGEST_BODY" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try {
                const r = JSON.parse(s);
                if (!r || typeof r.inserted === "undefined") {
                  console.error("Unexpected ingestion response:", s);
                  process.exit(1);
                }
                console.log("OK inserted=" + r.inserted + " updated=" + r.updated + " totalJobs=" + r.totalJobs);
              } catch(e) {
                console.error("Failed to parse ingestion response:", e.message, s);
                process.exit(1);
              }
            })'
