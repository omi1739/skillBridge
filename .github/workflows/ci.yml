name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # shared/dist is gitignored; build it first so backend & frontend can
      # resolve @skillbridge/types during typecheck/build (npm runs workspaces
      # in dependency order, but build explicitly to be safe).
      - name: Build shared types
        run: npm run build --workspace=@skillbridge/types

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Backend unit tests
        run: npm test --workspace=@skillbridge/api

      - name: Backend e2e tests
        run: npm run test:e2e --workspace=@skillbridge/api

      - name: Frontend tests
        run: npm test --workspace=@skillbridge/web
