# Render blueprint for the SkillBridge API (NestJS backend).
# The backend is one of three npm workspaces (shared, backend, frontend), so the
# rootRuntime/build run from the repo while service builds target the workspace.
# Deploy this API separately from the frontend (frontend is deployed on Vercel
# via /vercel.json with rootDirectory: frontend).
services:
  - type: web
    name: skillbridge-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@skillbridge/types && npm run build --workspace=@skillbridge/api
    startCommand: npm run start --workspace=@skillbridge/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JOB_API_URL
        sync: false
      - key: JOB_API_PAGES
        sync: false
      - key: JOB_MIN_MATCHES
        sync: false
      - key: JOB_SOURCE_NAME
        sync: false
      - key: JOB_BD_PAGES
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Google Gemini (free tier) for AI skill-question generation. Declared with
      # sync:false so the secret value is set in the Render dashboard, not the file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

  # Scheduled job-board ingestion, separate from the always-on web service so
  # it runs a fixed number of times per day instead of in the background.
  # Runs the BdJobs (Bangladesh) scraper three times a day (00/08/16 UTC).
  - type: cron
    name: skillbridge-api-bdjobs-ingest
    runtime: node
    plan: free
    schedule: "0 */8 * * *"
    buildCommand: npm install && npm run build --workspace=@skillbridge/types && npm run build --workspace=@skillbridge/api
    startCommand: npm run db:ingest --workspace=@skillbridge/api bdjobs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JOB_INGEST_SOURCE
        value: bdjobs
      - key: JOB_BD_PAGES
        sync: false
      - key: JOB_MIN_MATCHES
        sync: false
      - key: JOB_EXPIRE_DAYS
        value: 4
      - key: JOB_RETENTION_DAYS
        value: 7
