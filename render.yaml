# Render blueprint for the SkillBridge API (NestJS backend).
# The backend is one of three npm workspaces (shared, backend, frontend), so the
# rootRuntime/build run from the repo while service builds target the workspace.
# Deploy this API separately from the frontend (the frontend is deployed on
# Vercel as a separate project whose Root Directory is set to `frontend` in the
# Vercel dashboard — this repo has no vercel.json).
services:
  - type: web
    name: skillbridge-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@skillbridge/types && npm run build --workspace=@skillbridge/api
    startCommand: npm run start --workspace=@skillbridge/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      # One trusted proxy hop (Render terminates TLS in front of the API).
      - key: TRUST_PROXY
        value: "1"
      # Optional second Postgres project: when the primary hits its monthly
      # compute-hour quota (project paused), the API automatically fails over to
      # this connection string and probes the primary to switch back. The probe
      # only runs while the fallback is active, so a healthy primary is not kept
      # awake by periodic pings. Set in the Render dashboard so the URL stays out
      # of this file.
      - key: DATABASE_URL_FALLBACK
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Hard timeout (ms) for every outbound request (scrapers, GitHub verifier).
      - key: HTTP_TIMEOUT_MS
        value: "15000"
      # Optional alert webhook: 5xx errors and zero-yield ingestion runs are POSTed here.
      - key: ALERT_WEBHOOK_URL
        sync: false
      # Public frontend origin used to build password-reset links.
      - key: FRONTEND_URL
        value: https://skillbridge-dev-1739.vercel.app
      # Resend API key + From address for self-service password reset emails.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Allow the anonymous-demo flow (frontend uses the static demo token).
      # The token maps to a regular USER role only, so admin routes stay guarded.
      - key: ALLOW_DEMO_TOKEN
        value: "true"
      - key: JOB_API_URL
        sync: false
      - key: JOB_API_PAGES
        sync: false
      - key: JOB_MIN_MATCHES
        sync: false
      - key: JOB_SOURCE_NAME
        sync: false
      - key: JOB_BD_PAGES
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Google Gemini (free tier) for AI skill-question generation. Declared with
      # sync:false so the secret value is set in the Render dashboard, not the file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Fallback models tried in order when the primary is overloaded (503) or
      # retired (404). Keep this list short and fast: every entry adds latency
      # when the primary is unavailable.
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3-flash-preview

  # Job-board ingestion is scheduled by .github/workflows/ingest.yml, which
  # runs the same command every 8 hours without requiring paid Render compute.
  #
  # If you prefer a Render cron job instead, create one with a paid plan and:
  #   startCommand: npm run db:ingest --workspace=@skillbridge/api all
  #   schedule: "0 */8 * * *"
  #   DATABASE_URL: the same Supabase connection string as this web service
  #   JOB_EXPIRE_DAYS: 7
  #   JOB_RETENTION_DAYS: 14
  # Do not enable both schedulers; they would duplicate ingestion work.
