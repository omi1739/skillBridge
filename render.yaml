# Render blueprint for the SkillBridge API (NestJS backend).
# The backend is one of three npm workspaces (shared, backend, frontend), so the
# rootRuntime/build run from the repo while service builds target the workspace.
# Deploy this API separately from the frontend (the frontend is deployed on
# Vercel as a separate project whose Root Directory is set to `frontend` in the
# Vercel dashboard — this repo has no vercel.json).
services:
  - type: web
    name: skillbridge-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@skillbridge/types && npm run build --workspace=@skillbridge/api
    startCommand: npm run start --workspace=@skillbridge/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      # Optional second Neon project: when the primary hits its monthly
      # compute-hour quota (project paused), the API automatically fails over to
      # this connection string and probes the primary to switch back. Set in the
      # Render dashboard so the URL stays out of this file.
      - key: DATABASE_URL_FALLBACK
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Hard timeout (ms) for every outbound request (scrapers, GitHub verifier).
      - key: HTTP_TIMEOUT_MS
        value: "15000"
      # Optional alert webhook: 5xx errors and zero-yield ingestion runs are POSTed here.
      - key: ALERT_WEBHOOK_URL
        sync: false
      # Public frontend origin used to build password-reset links.
      - key: FRONTEND_URL
        value: https://skillbridge-dev-1739.vercel.app
      # Resend API key + From address for self-service password reset emails.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Allow the anonymous-demo flow (frontend uses the static demo token).
      # The token maps to a regular USER role only, so admin routes stay guarded.
      - key: ALLOW_DEMO_TOKEN
        value: "true"
      - key: JOB_API_URL
        sync: false
      - key: JOB_API_PAGES
        sync: false
      - key: JOB_MIN_MATCHES
        sync: false
      - key: JOB_SOURCE_NAME
        sync: false
      - key: JOB_BD_PAGES
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Google Gemini (free tier) for AI skill-question generation. Declared with
      # sync:false so the secret value is set in the Render dashboard, not the file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      # Fallback models tried in order when the primary is overloaded (503) or
      # retired (404); free-tier models are frequently saturated.
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.8-flash

  # Scheduled job-board ingestion, separate from the always-on web service so
  # it runs a fixed number of times per day instead of in the background.
  # Runs both boards (Arbeitnow + BdJobs) three times a day (00/08/16 UTC) so
  # every source stays fresh and its jobs are re-upserted (which refreshes the
  # verification timestamp) before the retention sweep can delete them.
  - type: cron
    name: skillbridge-api-ingest
    runtime: node
    plan: free
    schedule: "0 */8 * * *"
    buildCommand: npm install && npm run build --workspace=@skillbridge/types && npm run build --workspace=@skillbridge/api
    startCommand: npm run db:ingest --workspace=@skillbridge/api all
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Second Neon connection string for failover (see web service comment).
      - key: DATABASE_URL_FALLBACK
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JOB_INGEST_SOURCE
        value: all
      - key: JOB_BD_PAGES
        sync: false
      - key: JOB_MIN_MATCHES
        sync: false
      # Jobs are refreshed every 8 hours by this cron, so a 7-day expiry plus a
      # 14-day hard-delete window tolerates a few missed runs without letting
      # stale postings linger indefinitely.
      - key: JOB_EXPIRE_DAYS
        value: 7
      - key: JOB_RETENTION_DAYS
        value: 14
      - key: HTTP_TIMEOUT_MS
        value: "15000"
      # Optional alert webhook: failed/zero-yield ingestion runs are POSTed here.
      - key: ALERT_WEBHOOK_URL
        sync: false
